<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Seleção de coordenadas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Seleção de coordenadas</h1>
    </div>
  </header>
  <main class="workspace">
    <section class="map-panel" aria-labelledby="map-title">
      <div class="map-toolbar">
        <div>
          <h2 id="map-title">Mapa interativo</h2>
          <p>Satélite · Esri World Imagery</p>
        </div>
        <button id="reset-view" type="button" disabled>Voltar à vista inicial</button>
      </div>
      <div id="map" role="region" aria-label="Mapa interativo"></div>
      <p id="map-status" class="map-status" role="status" hidden></p>
      <noscript>Ative o JavaScript para usar o mapa.</noscript>
    </section>
    <aside class="details" aria-labelledby="details-title">
      <p class="mode">Modo demonstração</p>
      <h2 id="details-title">Ponto de manutenção</h2>
      <div class="fields">
        <label>Código SAP
          <input id="codigo-sap" type="text" autocomplete="off">
        </label>
        <label>Descrição
          <textarea id="descricao" rows="3"></textarea>
        </label>
      </div>
      <section class="capture" aria-labelledby="capture-title">
        <h3 id="capture-title">Coordenadas</h3>
        <p id="reference-status" class="point-status" role="status">Sem localização SAP selecionada.</p>
        <p id="point-origin" class="point-status" hidden></p>
        <p id="capture-help">Clique no mapa para marcar um ponto. Pelo teclado, navegue até o local e capture o centro da vista.</p>
        <div class="coordinates">
          <label>Latitude <input id="latitude" readonly placeholder="—"></label>
          <label>Longitude <input id="longitude" readonly placeholder="—"></label>
        </div>
        <div class="actions">
          <button id="capture-center" type="button" disabled>Capturar centro</button>
          <button id="clear-point" type="button" disabled>Limpar ponto</button>
          <button id="copy-coordinates" type="button" disabled>Copiar coordenadas</button>
        </div>
        <p id="capture-status" class="sr-only" role="status"></p>
        <div class="actions">
          <button id="confirm-location" type="button" disabled>Confirmar localização</button>
        </div>
        <p id="return-status" class="point-status" role="status"></p>
      </section>
      <details class="json-output">
        <summary>Saída JSON</summary>
        <pre id="selection-json"></pre>
      </details>
    </aside>
  </main>
</body>
</html>
